# Stack Docker ISOLÉE pour validation V7.16.3 — ne jamais pointer vers naxialis_agent.
# Usage :
#   docker compose -p naxialis-validate -f docker-compose.validate.yml up -d --build
#   docker compose -p naxialis-validate -f docker-compose.validate.yml down
# Ne pas utiliser -v sur la stack principale.

name: naxialis-validate

services:
  postgres:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: validate
      POSTGRES_PASSWORD: validate_only_local
      POSTGRES_DB: naxialis_agent_validate
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - validate_postgres_data:/var/lib/postgresql/data
    networks:
      - validate_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U validate -d naxialis_agent_validate"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: naxialis-agent:v7.16.3-local
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:4300:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgresql://validate:validate_only_local@postgres:5432/naxialis_agent_validate
      AUTH_SECRET: validate-auth-secret-32chars-min!!
      AUTH_URL: http://127.0.0.1:4300
      AUTH_TRUST_HOST: "true"
      ADMIN_EMAIL: validate@example.invalid
      # bcrypt("ValidateOnly!23") encodé base64 — local validate uniquement
      ADMIN_PASSWORD_HASH: JDJiJDEwJHAxOUEvQmVTT0Jic3lnUzlzamFCcHVUaFAxQkhmZ2dmbnpKNGwwczNKazh2bno3OUlJaksu
      APP_SETTINGS_ENCRYPTION_KEY: validate-app-settings-key-32b!!
      FEATURED_IMAGE_STORAGE_DIR: /app/storage/featured-images
      SKIP_PRISMA_MIGRATE: "0"
    volumes:
      - validate_images_data:/app/storage/featured-images
    networks:
      - validate_net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  validate_postgres_data:
  validate_images_data:

networks:
  validate_net:
    name: naxialis-validate-net
