# Stack isolée V7.16.4 — reverse proxy HTTPS (scénario OPS-03A / prod-like).
# Ne jamais pointer vers naxialis_agent ni agent_client_01.
#
#   docker compose -p naxialis-validate-https -f docker-compose.validate-https.yml up -d --build
#   bash scripts/ops/ops03a-validate-https.sh
#   docker compose -p naxialis-validate-https -f docker-compose.validate-https.yml down -v

name: naxialis-validate-https

services:
  postgres:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: validate
      POSTGRES_PASSWORD: validate_only_local
      POSTGRES_DB: naxialis_agent_validate_https
    volumes:
      - validate_https_pg:/var/lib/postgresql/data
    networks:
      - validate_https_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U validate -d naxialis_agent_validate_https"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: naxialis-agent:v7.16.4-local
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgresql://validate:validate_only_local@postgres:5432/naxialis_agent_validate_https
      AUTH_SECRET: validate-https-auth-secret-32chars!!
      AUTH_URL: https://127.0.0.1:4443
      AUTH_TRUST_HOST: "true"
      ADMIN_EMAIL: validate@example.invalid
      # bcrypt("ValidateOnly!23") base64
      ADMIN_PASSWORD_HASH: JDJiJDEwJHAxOUEvQmVTT0Jic3lnUzlzamFCcHVUaFAxQkhmZ2dmbnpKNGwwczNKazh2bno3OUlJaksu
      APP_SETTINGS_ENCRYPTION_KEY: validate-https-settings-key-32b!!
      FEATURED_IMAGE_STORAGE_DIR: /app/storage/featured-images
      SKIP_PRISMA_MIGRATE: "0"
      # Google OAuth env présents pour status.oauthConfigured (pas de sync réelle)
      GOOGLE_CLIENT_ID: validate-google-client-id
      GOOGLE_CLIENT_SECRET: validate-google-client-secret
      GOOGLE_TOKEN_ENCRYPTION_KEY: validate-google-token-key-32bytes!!
    volumes:
      - validate_https_images:/app/storage/featured-images
    networks:
      - validate_https_net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  proxy:
    image: nginx:1.27-alpine
    restart: "no"
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:4443:443"
    volumes:
      - ./scripts/ops/validate-https/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./scripts/ops/validate-https/certs:/etc/nginx/certs:ro
    networks:
      - validate_https_net

volumes:
  validate_https_pg:
  validate_https_images:

networks:
  validate_https_net:
    name: naxialis-validate-https-net
