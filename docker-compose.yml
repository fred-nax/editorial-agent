name: naxialis-agent

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-naxialis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-naxialis_agent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-naxialis} -d ${POSTGRES_DB:-naxialis_agent}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      AUTH_URL: https://agent.naxialis.com
      AUTH_TRUST_HOST: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-naxialis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-naxialis_agent}
      FEATURED_IMAGE_STORAGE_DIR: /app/storage/featured-images
      VIRTUAL_HOST: agent.naxialis.com
      VIRTUAL_PORT: "3000"
      LETSENCRYPT_HOST: agent.naxialis.com
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-contact@naxialis.com}
    volumes:
      - featured_images_data:/app/storage/featured-images
    networks:
      - internal
      - proxy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    # PostgreSQL n’est pas publié hors réseau internal (prod).
    # Le reverse proxy (réseau proxy) expose HTTPS — pas le port 3000 public.

volumes:
  postgres_data:
  featured_images_data:

networks:
  internal:
    name: naxialis-agent-internal
  proxy:
    name: ${PROXY_NETWORK:-naxialis-agent-proxy-local}
    external: ${PROXY_EXTERNAL:-false}
